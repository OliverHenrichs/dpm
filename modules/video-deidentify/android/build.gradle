plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videodeidentify'
version = '0.1.0'

android {
  namespace "expo.modules.videodeidentify"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Must match expo-video's androidxMedia3Version, or the two resolve to one
  // version behind expo-video's back.
  def media3Version = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "com.google.mediapipe:tasks-vision:0.10.35"
}
