plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appupdate'
version = '0.1.0'

android {
  namespace "expo.modules.appupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google Play In-App Updates. Ships its own R8 rules.
  implementation "com.google.android.play:app-update:2.1.0"
}
