plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.genaiprobe'
version = '0.1.0'

android {
  namespace "expo.modules.genaiprobe"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // SPIKE (L4 suggestions): Gemini Nano through ML Kit's Prompt API, to see whether this phone
  // has it and how it compares with a model we ship ourselves.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
}
