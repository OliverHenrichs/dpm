name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly audit run, so a new advisory or an expired acceptance surfaces
  # (as a failed run, which GitHub emails about) even when nobody pushes.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Metro and tsc are memory-hungry on the default runner.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Lint, typecheck, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx}" "app/**/*.{ts,tsx}" "__tests__/**/*.{ts,tsx}" "utils/**/*.{ts,tsx}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --coverage --ci --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  bundle:
    name: Bundle web and Android
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both targets are built because Metro resolves `.web.tsx` in preference
      # to `.tsx`, so a bad import can break exactly one platform. Web also
      # builds an SSR bundle (static rendering is on), surfacing such a fault
      # twice. See AGENTS.md, "Platform-specific code".
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-web

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android

  rules:
    name: Firestore rules
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator needs Java 21 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Runs firestore.rules in the emulator against the documents the app
      # writes. See src/firebase/AGENTS.md.
      - name: Test rules
        run: npm run test:rules

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/check-audit.js lists the advisories we have reviewed and accept
      # (no patched release, or dev tooling only); see AGENTS.md. Any other
      # advisory, at any severity, fails the job.
      - name: Fail on unreviewed vulnerabilities
        run: |
          npm audit --json > audit.json || true
          node scripts/check-audit.js audit.json
