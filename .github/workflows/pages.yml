name: Website

# Publishes website/ to GitHub Pages. One-time setup: repository Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "PRIVACY_POLICY.md"
      - "TERMS_OF_USE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The privacy and terms pages are rendered from PRIVACY_POLICY.md and TERMS_OF_USE.md,
      # so what is published is always the committed text.
      - name: Render privacy policy and terms of use
        run: |
          pip install markdown
          python3 website/build-privacy.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v5
